<!-- Alto de la pantalla menos el header (3rem): el aside ya es sticky en Taiga, así el botón de colapsar siempre queda visible -->
<aside
  [tuiNavigationAside]="expanded()"
  class="h-[calc(100vh-3rem)]"
  style="
    background: linear-gradient(
      180deg,
      rgb(15, 23, 42),
      rgb(30, 41, 59)
    );
  "
>
  <!-- Opciones: si no caben, hacen scroll sin empujar el botón de colapsar -->
  <nav class="-mx-2 flex min-h-0 flex-1 flex-col overflow-y-auto px-2">
  @for (group of groupsOptions(); track group.item.route) {
    @if (group.children?.length) {
      <tui-aside-group>
        <button
          tuiAsideItem
          tuiChevron
          tuiTextfieldSize="s"
          type="button"
          [iconStart]="group.item.icon"
        >
          {{ group.item.label }}

          <ng-template>
            @for (child of group.children; track child.route) {
              <a tuiAsideItem tuiTextfieldSize="s" [routerLink]="child.route">
                {{ child.label }}
              </a>
            }
          </ng-template>
        </button>
      </tui-aside-group>
    } @else {
      <a
        tuiAsideItem
        tuiTextfieldSize="s"
        [iconStart]="group.item.icon"
        [routerLink]="group.item.route"
      >
        {{ group.item.label }}
      </a>
    }
  }

  </nav>

  <!-- flex-none y sin el ::before espaciador de Taiga: el que crece ahora es el nav -->
  <footer class="mt-2 flex-none! border-t border-white/10 pt-2 before:hidden">
    <button
      tuiAsideItem
      tuiTextfieldSize="s"
      type="button"
      [iconStart]="expanded() ? '@tui.chevron-left' : '@tui.chevron-right'"
      (click)="handleToggle()"
    >
      {{ expanded() ? 'Collapse' : 'Expand' }}
    </button>
  </footer>
</aside>
