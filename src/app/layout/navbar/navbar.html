<header
  tuiNavigationHeader
  class="flex items-center justify-between"
  style="background: linear-gradient(90deg, rgb(15, 23, 42), rgb(30, 41, 59))"
>
  <!-- Menú móvil: las mismas secciones del sidebar -->
  <button
    class="block md:hidden!"
    portal
    title="Menú"
    tuiIconButton
    tuiNavigationDrawer
    type="button"
    [(open)]="menuOpen"
  >
    <tui-data-list>
      @for (group of groupsOptions(); track group.item.route) {
        <button
          tuiOption
          type="button"
          size="xs"
          [iconStart]="group.item.icon"
          [routerLink]="group.item.route"
          (click)="menuOpen.set(false)"
        >
          {{ group.item.label }}
        </button>

        @for (child of group.children ?? []; track child.route) {
          <button
            tuiOption
            type="button"
            size="xs"
            [iconStart]="child.icon"
            [routerLink]="child.route"
            (click)="menuOpen.set(false)"
          >
            {{ child.label }}
          </button>
        }
      }
    </tui-data-list>
  </button>

  <!-- Marca -->
  <span tuiNavigationLogo class="flex items-center gap-3">
    <tui-icon icon="@tui.heart-pulse" class="text-white" style="font-size: 28px" />

    <span class="flex items-baseline gap-2">
      <span class="text-xl font-semibold tracking-tight text-white">Aura</span>
      <span class="text-xs font-semibold uppercase tracking-[0.25em] text-slate-300">Bioclinic</span>
    </span>
  </span>

  <div class="flex items-center gap-2">
    <!-- Notificaciones: pendiente del stream SSE (docs/GUIA-SSE.md) -->
    <button
      iconStart="@tui.bell"
      tuiIconButton
      type="button"
      aria-label="Notificaciones"
      [attr.aria-expanded]="notificationsOpen()"
      [tuiDropdown]="notificationsDropdown"
      [tuiDropdownManual]="notificationsOpen()"
      [tuiObscuredEnabled]="notificationsOpen()"
      (click)="toggle(notificationsOpen)"
      (tuiActiveZoneChange)="closeWhen(notificationsOpen, !$event)"
      (tuiObscured)="closeWhen(notificationsOpen, $event)"
    >
      <ng-template #notificationsDropdown>
        <div class="flex w-64 flex-col items-center gap-2 px-4 py-6 text-center">
          <tui-icon icon="@tui.bell-off" class="text-2xl text-slate-300" />
          <p class="text-sm text-slate-500">No tienes notificaciones</p>
        </div>
      </ng-template>
    </button>

    <!-- Usuario -->
    <button
      tuiIconButton
      type="button"
      aria-label="Cuenta"
      [attr.aria-expanded]="avatarOpen()"
      [tuiDropdown]="avatarDropdown"
      [tuiDropdownManual]="avatarOpen()"
      [tuiObscuredEnabled]="avatarOpen()"
      (click)="toggle(avatarOpen)"
      (tuiActiveZoneChange)="closeWhen(avatarOpen, !$event)"
      (tuiObscured)="closeWhen(avatarOpen, $event)"
    >
      <tui-avatar [tuiAvatar]="initials() || '@tui.user'" />

      <ng-template #avatarDropdown>
        <tui-data-list>
          <button tuiOption type="button" (click)="onProfile()">
            <tui-icon icon="@tui.user" />
            <span tuiTitle>Perfil</span>
          </button>

          <button tuiOption type="button" (click)="onLogout()">
            <tui-icon icon="@tui.log-out" />
            <span tuiTitle>Cerrar sesión</span>
          </button>
        </tui-data-list>
      </ng-template>
    </button>
  </div>
</header>
