<div class="flex w-full flex-col gap-5">

  <!-- Header -->
  <div class="flex w-full items-center gap-4">

    <div class="flex-1">
      <app-patient-filters
        (filtersChange)="onFiltersChange($event)"
      />
    </div>

    <button
      tuiButton
      type="button"
      iconStart="@tui.plus"
      size="s"
      appearance="primary"
      [disabled]="patientsResource.isLoading()"
      (click)="createPatientModal()"
    >
      Nuevo paciente
    </button>

  </div>

  <!-- Acciones masivas -->
  @if (selected().length) {
    <app-bulk-actions-bar
      itemLabel="pacientes"
      itemLabelSingular="paciente"
      [count]="selected().length"
      [busy]="bulkBusy()"
      (clear)="selected.set([])"
    >
      <button
        tuiButton
        type="button"
        size="s"
        appearance="secondary"
        iconStart="@tui.download"
        [disabled]="bulkBusy()"
        (click)="exportSelected()"
      >
        Exportar CSV
      </button>

      <button
        tuiButton
        type="button"
        size="s"
        appearance="secondary-destructive"
        iconStart="@tui.trash-2"
        [disabled]="bulkBusy()"
        (click)="deleteSelected()"
      >
        Eliminar
      </button>
    </app-bulk-actions-bar>
  }

  <!-- Error -->
  @if (patientsResource.error()) {
    <app-state-message
      variant="error"
      title="No se pudieron cargar los pacientes"
      description="Ocurrió un problema al obtener la información."
      (action)="patientsResource.reload()"
    />
  }

  <!-- Tabla -->
  @if (!patientsResource.error()) {

    <app-patient-table
      [patients]="patients()"
      [loading]="patientsResource.isLoading()"
      [(selected)]="selected"
      [loadingPatientId]="loadingPatientId()"
      [selectedPatient]="selectedPatient()"
      (edit)="editPatientModal($event)"
      (more)="morePatient($event)"
      (remove)="deletePatient($event)"
      (closeDetail)="selectedPatient.set(null)"
    />

    
    <!-- Paginación -->
    <tui-table-pagination
      [items]="sizeOptions"
      [total]="patientsResource.value()?.totalElements ?? 0"
      [size]="size()"
      [page]="page()"
      (pageChange)="changePage($event)"
      (sizeChange)="changeSize($event)"
      class="mt-auto"
    />

  }

</div>
