<div
  class="relative flex min-h-screen items-center justify-center overflow-hidden bg-cover bg-center bg-no-repeat p-6"
  style="background-image: url('/clinica.webp')"
>
  <!-- Fondo -->
  <div
    class="absolute inset-0 bg-linear-to-br from-slate-950/60 via-blue-950/40 to-cyan-900/30"
  ></div>

  <!-- Login -->
  <div class="relative w-full max-w-md overflow-hidden rounded-2xl bg-white shadow-2xl">
    <!-- Imagen -->
    <div class="relative h-64 w-full overflow-hidden">
      <img
        src="https://media.istockphoto.com/id/2158610739/es/foto/m%C3%A9dico-guapo-con-estetoscopio-sobre-el-cuello-trabajando-mientras-mira-a-la-c%C3%A1mara-en-la.jpg?s=612x612&w=0&k=20&c=meqU3H6FI07LqfM8Iyr8FSTwpMAjcOs6U-bQbilV8HE="
        alt="Médico"
        class="h-full w-full object-cover"
      />

      <!-- Degradado sobre imagen -->
      <div
        class="absolute inset-0 bg-linear-to-t from-slate-950/80 via-slate-950/20 to-transparent"
      ></div>

      <!-- Título dentro de la imagen -->
      <div class="absolute bottom-6 left-6 text-white">
        <h1 class="text-3xl font-semibold">Iniciar sesión</h1>

        <p class="mt-1 text-sm text-white/80">Ingresa tus credenciales para continuar</p>
      </div>
    </div>

    <!-- Formulario -->
    <div class="p-8">
      <div class="flex flex-col gap-7">
        <!-- Email -->
        <tui-textfield [tuiTextfieldCleaner]="false" tuiTextfieldSize="s">
          <input tuiInput type="email" placeholder="Correo electrónico" [(ngModel)]="email" />

          @if (email) {
            <button tabindex="-1" tuiButtonX type="button" (click)="clearEmail()">Clear</button>
          }
        </tui-textfield>

        <!-- Password -->
        <tui-textfield [tuiTextfieldCleaner]="false" tuiTextfieldSize="s">
          <input tuiInput type="password" placeholder="Contraseña" [(ngModel)]="password" />

          @if (password) {
            <button tabindex="-1" tuiButtonX type="button" (click)="clearPassword()">Clear</button>
          }
        </tui-textfield>

        <!-- Botón -->
        <button
          tuiButton
          type="button"
          appearance="primary"
          size="s"
          class="w-full"
          (click)="login()"
        >
          Iniciar sesión
        </button>
      </div>
    </div>
  </div>
</div>
