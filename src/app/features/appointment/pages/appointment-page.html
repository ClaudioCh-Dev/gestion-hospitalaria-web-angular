<div *appHasPermission="'APPOINTMENT_CREATE'" class="mb-4 flex justify-end">

    tuiButton
    type="button"
    appearance="primary"
    [routerLink]="['/appointments/create']"
    size="s"
  >
    + Nueva cita

</div>

<!-- Admin: cuadrícula de todos los médicos. Médico: su día en vertical -->

} @else {
  <app-doctor-agenda />
}
