<div class="flex w-full flex-col gap-4 sm:flex-row">
  <!-- Buscar -->

  <label tuiLabel class="flex-1">
    <tui-textfield iconStart="@tui.search" tuiTextfieldSize="s">
      <input
        tuiInput
        placeholder="Buscar doctor..."
        [(ngModel)]="search"
        (ngModelChange)="applyFilters()"
      />
    </tui-textfield>
  </label>

  <!-- Especialidad -->

  <label tuiLabel class="flex-1">
    <tui-textfield tuiChevron tuiTextfieldSize="s" [tuiTextfieldCleaner]="false">
      <input tuiSelect [(ngModel)]="specialty" (ngModelChange)="applyFilters()" />

      <tui-data-list-wrapper
        *tuiDropdown
        [items]="specialties"
        //[itemContent]="itemContent"
      />
    </tui-textfield>
  </label>
</div>
