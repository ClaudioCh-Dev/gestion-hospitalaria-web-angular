<div class="flex w-full flex-col gap-5">

  <!-- Header -->
  <div class="flex w-full items-center gap-4">

    <!-- Filtros -->
    <div class="flex-1">
      <app-doctor-filters
        (filtersChange)="onFiltersChange($event)"
      />
    </div>

    <!-- Crear especialidad -->
    <button
      tuiButton
      type="button"
      iconStart="@tui.plus"
      size="s"
      appearance="secondary"
      (click)="createSpecialtyModal()"
    >
      Nueva especialidad
    </button>

    <!-- Crear doctor -->
    <button
      tuiButton
      type="button"
      iconStart="@tui.plus"
      size="s"
      appearance="primary"
      (click)="createDoctorModal()"
    >
      Nuevo doctor
    </button>

  </div>

  <!-- Segunda fila: siempre visible para que la tabla no se mueva al seleccionar -->
  <div class="flex min-h-8 items-center justify-between gap-4">
    <span class="text-sm text-slate-500">
      @if (selected().length) {
        <strong class="text-slate-900">{{ selected().length }}</strong>
        {{ selected().length === 1 ? 'médico seleccionado' : 'médicos seleccionados' }}
      } @else {
        {{ doctorsResource.value()?.totalElements ?? 0 }} médicos
      }
    </span>

    <div class="flex items-center gap-2">
      @if (selected().length) {
        <button
          tuiIconButton
          type="button"
          size="s"
          appearance="flat"
          iconStart="@tui.x"
          [disabled]="bulkBusy()"
          (click)="selected.set([])"
        >
          Limpiar selección
        </button>

        <button
          tuiButton
          type="button"
          size="s"
          appearance="secondary-destructive"
          iconStart="@tui.ban"
          [disabled]="bulkBusy() || !selectedActive().length"
          (click)="deactivateSelected()"
        >
          Desactivar ({{ selectedActive().length }})
        </button>
      }

      <button
        tuiButton
        type="button"
        size="s"
        appearance="secondary"
        iconStart="@tui.download"
        [loading]="exporting()"
        [disabled]="bulkBusy()"
        (click)="exportCsv()"
      >
        {{ selected().length ? 'Exportar (' + selected().length + ')' : 'Exportar CSV' }}
      </button>
    </div>
  </div>

  <!-- Error -->
  @if (doctorsResource.error()) {
    <app-state-message
      variant="error"
      title="No se pudieron cargar los médicos"
      description="Ocurrió un problema al obtener la información."
      (action)="doctorsResource.reload()"
    />
  } @else {

  <!-- Tabla -->
  <div class="flex flex-col gap-4 rounded-xl border border-slate-200 bg-white p-4 shadow-md">
  <app-doctor-table
    [doctors]="doctors()"
    [loading]="doctorsResource.isLoading()"
    [loadingDoctorId]="loadingDoctorId()"
    [loadingAction]="loadingAction()"
    [(selected)]="selected"
    [selectedDoctor]="selectedDoctor()"
    (edit)="editDoctorModal($event)"
    (more)="moreDoctor($event)"
    (closeDetail)="selectedDoctor.set(null)"
  />

  <!-- Paginación -->
  <tui-table-pagination
    [items]="sizeOptions"
    [total]="
      doctorsResource.value()?.totalElements ?? 0
    "
    [size]="size()"
    [page]="page()"
    (pageChange)="changePage($event)"
    (sizeChange)="changeSize($event)"
    class="h-full"
  />
  </div>

  }

</div>
