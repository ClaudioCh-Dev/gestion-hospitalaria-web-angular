<div class="flex w-full flex-col gap-5">

  <!-- Header -->
  <div class="flex w-full items-center gap-4">

    <!-- Filtros -->
    <div class="flex-1">
      <app-doctor-filters
        (filtersChange)="onFiltersChange($event)"
      />
    </div>

    <!-- Crear especialidad -->
    <button
      tuiButton
      type="button"
      iconStart="@tui.plus"
      size="s"
      appearance="secondary"
      (click)="createSpecialtyModal()"
    >
      Nueva especialidad
    </button>

    <!-- Crear doctor -->
    <button
      tuiButton
      type="button"
      iconStart="@tui.plus"
      size="s"
      appearance="primary"
      (click)="createDoctorModal()"
    >
      Nuevo doctor
    </button>

  </div>

  <!-- Acciones masivas -->
  @if (selected().length) {
    <app-bulk-actions-bar
      itemLabel="médicos"
      itemLabelSingular="médico"
      [count]="selected().length"
      [busy]="bulkBusy()"
      (clear)="selected.set([])"
    >
      <button
        tuiButton
        type="button"
        size="s"
        appearance="secondary"
        iconStart="@tui.download"
        [disabled]="bulkBusy()"
        (click)="exportSelected()"
      >
        Exportar CSV
      </button>

      <button
        tuiButton
        type="button"
        size="s"
        appearance="secondary-destructive"
        iconStart="@tui.ban"
        [disabled]="bulkBusy() || !selectedActive().length"
        (click)="deactivateSelected()"
      >
        Desactivar
        @if (selectedActive().length !== selected().length) {
          ({{ selectedActive().length }} activos)
        }
      </button>
    </app-bulk-actions-bar>
  }

  <!-- Error -->
  @if (doctorsResource.error()) {
    <app-state-message
      variant="error"
      title="No se pudieron cargar los médicos"
      description="Ocurrió un problema al obtener la información."
      (action)="doctorsResource.reload()"
    />
  } @else {

  <!-- Tabla -->
  <app-doctor-table
    [doctors]="doctors()"
    [loading]="doctorsResource.isLoading()"
    [loadingDoctorId]="loadingDoctorId()"
    [loadingAction]="loadingAction()"
    [(selected)]="selected"
    [selectedDoctor]="selectedDoctor()"
    (edit)="editDoctorModal($event)"
    (more)="moreDoctor($event)"
    (closeDetail)="selectedDoctor.set(null)"
  />

  <!-- Paginación -->
  <tui-table-pagination
    [items]="sizeOptions"
    [total]="
      doctorsResource.value()?.totalElements ?? 0
    "
    [size]="size()"
    [page]="page()"
    (pageChange)="changePage($event)"
    (sizeChange)="changeSize($event)"
    class="h-full"
  />

  }

</div>
